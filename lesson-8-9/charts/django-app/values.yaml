# Default values for django-app
replicaCount: 2

image:
  repository: 978045176156.dkr.ecr.us-west-2.amazonaws.com/django-app-lesson7
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: false
  runAsUser: 0

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Django application configuration
django:
  # Database configuration
  database:
    name: myproject_db
    user: myproject_user
    password: myproject_password
    host: postgres-service  # You'll need to deploy PostgreSQL separately or use RDS
    port: "5432"
  
  # Django settings
  debug: "False"
  secretKey: "change-this-to-a-secure-random-secret-key-in-production"
  allowedHosts: "*"
  
  # Static files
  staticUrl: "/static/"
  staticRoot: "/app/staticfiles"

# Health checks
livenessProbe:
  httpGet:
    path: /
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
