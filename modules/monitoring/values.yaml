# kube-prometheus-stack Helm values
# Optimized for small nodes (t3.small)

# Prometheus configuration
prometheus:
  prometheusSpec:
    # Resource limits for Prometheus server
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "300m"
        memory: "512Mi"
    
    # Storage configuration
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    
    # Retention period
    retention: 7d
    
    # Enable service monitors
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

  # Prometheus service configuration
  service:
    type: "${service_type}"
    port: 9090

# Grafana configuration
grafana:
  enabled: true
  
  # Admin credentials
  adminPassword: "admin"  # Change in production
  
  # Resource limits for Grafana
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "300m"
      memory: "512Mi"
  
  # Service configuration
  service:
    type: "${service_type}"
    port: 80
  
  # Pre-installed dashboards
  defaultDashboardsEnabled: true
  
  # Datasources
  # datasources:
  #   datasources.yaml:
  #     apiVersion: 1
  #     datasources:
  #       - name: Prometheus
  #         type: prometheus
  #         url: http://kube-prometheus-stack-prometheus:9090
  #         access: proxy
  #         isDefault: true

# AlertManager configuration
alertmanager:
  enabled: true
  
  alertmanagerSpec:
    # Resource limits for AlertManager
    resources:
      requests:
        cpu: "25m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
    
    # Storage
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

# Prometheus Operator configuration
prometheusOperator:
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"

# Node Exporter (collects node metrics)
nodeExporter:
  enabled: true
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

# kube-state-metrics (collects Kubernetes object metrics)
kube-state-metrics:
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

# Disable components not needed for basic setup
kubeApiServer:
  enabled: true

kubelet:
  enabled: true

kubeControllerManager:
  enabled: false

coreDns:
  enabled: true

kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false
