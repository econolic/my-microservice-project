apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "django-app.fullname" . }}-config
  labels:
    {{- include "django-app.labels" . | nindent 4 }}
data:
  DATABASE_NAME: {{ .Values.django.database.name | quote }}
  DATABASE_USER: {{ .Values.django.database.user | quote }}
  DATABASE_HOST: {{ .Values.django.database.host | quote }}
  DATABASE_PORT: {{ .Values.django.database.port | quote }}
  DEBUG: {{ .Values.django.debug | quote }}
  ALLOWED_HOSTS: {{ .Values.django.allowedHosts | quote }}
  STATIC_URL: {{ .Values.django.staticUrl | quote }}
  STATIC_ROOT: {{ .Values.django.staticRoot | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "django-app.fullname" . }}-secret
  labels:
    {{- include "django-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_PASSWORD: {{ .Values.django.database.password | quote }}
  SECRET_KEY: {{ .Values.django.secretKey | quote }}
